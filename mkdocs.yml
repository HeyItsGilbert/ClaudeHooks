site_name: Claude Hooks
site_url: http://heyitsgilbert.github.io/ClaudeHooks
site_description: PowerShell helpers for writing and registering Claude Code hook scripts.
repo_url: http://github.com/HeyItsGilbert/ClaudeHooks
repo_name: HeyItsGilbert/ClaudeHooks

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Changelog: "https://github.com/HeyItsGilbert/ClaudeHooks/blob/main/CHANGELOG.md"
  - Commands:
      - en-US/
  - Examples:
      - Examples/

plugins:
  - search
  - include_dir_to_nav

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true
